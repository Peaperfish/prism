name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # one broken platform shouldn't hide the others' results
      matrix:
        include:
          # The one job with RAW support. GCC, because LibRaw's headers ask for OpenMP, which
          # GCC has built in (Clang on Linux would also need libomp).
          - name: Linux GCC + LibRaw
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Release
            libraw: 'ON'
          - name: Linux Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Release
            libraw: 'OFF'
          - name: macOS (Apple Clang)
            os: macos-latest
            cc: clang
            cxx: clang++
            build_type: Release
            libraw: 'OFF'
          # ThreadSanitizer: reports any data race in the multithreaded stages (see README).
          - name: Linux Clang ThreadSanitizer
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Debug
            libraw: 'OFF'
            tsan: 'ON'
          # AddressSanitizer + UndefinedBehaviorSanitizer: out-of-bounds access, use-after-free,
          # leaks and undefined behaviour (see README).
          - name: Linux Clang ASan + UBSan
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Debug
            libraw: 'OFF'
            asan: 'ON'
          # MSVC with the default Visual Studio generator, which is multi-config: it ignores
          # CMAKE_BUILD_TYPE, so Build and Test pass the configuration explicitly (see below).
          # Windows has no system LibRaw, so this job builds the pinned release from source as
          # libraw_r.dll (cmake/LibRaw.cmake).
          - name: Windows MSVC + LibRaw (source)
            os: windows-latest
            cc: cl
            cxx: cl
            build_type: Release
            libraw: 'ON'
            libraw_source: 'ON'

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # UBSan only prints a report by default; make it fail the test, with a stack trace.
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - uses: actions/checkout@v4

      - name: Install LibRaw
        if: matrix.libraw == 'ON' && matrix.libraw_source != 'ON'
        run: sudo apt-get update && sudo apt-get install -y libraw-dev pkg-config

      # Recent Ubuntu kernels randomise more address bits than TSan's shadow memory layout
      # allows ("unexpected memory mapping"); 28 bits is what it supports.
      - name: Allow ThreadSanitizer's memory layout
        if: matrix.tsan == 'ON'
        run: sudo sysctl vm.mmap_rnd_bits=28

      # GoogleTest and the LibRaw source (FetchContent) are downloaded into .deps, cached per job
      # and keyed on the files that pin their versions, so most runs skip the download.
      - name: Cache FetchContent downloads
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ matrix.os }}-${{ matrix.name }}-${{ hashFiles('tests/CMakeLists.txt', 'cmake/LibRaw.cmake') }}

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPRISM_WITH_LIBRAW=${{ matrix.libraw }}
          -DPRISM_LIBRAW_FROM_SOURCE=${{ matrix.libraw_source || 'OFF' }}
          -DPRISM_SANITIZE_THREAD=${{ matrix.tsan || 'OFF' }}
          -DPRISM_SANITIZE_ADDRESS=${{ matrix.asan || 'OFF' }}
          -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.deps

      # --config and -C pick the configuration on multi-config generators (Visual Studio);
      # single-config ones (Makefiles on Linux and macOS) ignore them.
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # LibRaw must stay a separate DLL (its LGPL/CDDL terms): check that prism.exe and the tests
      # import libraw_r.dll rather than containing LibRaw, and that the build copied the DLL next
      # to them. (prism_profile.exe calls no RAW code, so MSVC's linker drops the import there.)
      - name: Check that LibRaw is a separate DLL
        if: runner.os == 'Windows' && matrix.libraw_source == 'ON'
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          foreach ($exe in 'src\Release\prism.exe', 'tests\Release\prism_tests.exe') {
            $deps = & $dumpbin.FullName /dependents "build\$exe" | Out-String
            Write-Output "$exe imports:" $deps
            if ($deps -notmatch 'libraw_r\.dll') { throw "$exe does not import libraw_r.dll" }
            $dir = Split-Path "build\$exe"
            if (-not (Test-Path "$dir\libraw_r.dll")) { throw "libraw_r.dll is missing from $dir" }
          }

      # In parallel: every CLI test uses its own temporary file names. The synthetic DNG tests run
      # everywhere; the integration tests with a real camera file skip themselves because
      # PRISM_TEST_RAW is not set (there is no RAW file in the repo).
      # PRISM_REQUIRE_RAW=1 makes the jobs with LibRaw fail if the build lost RAW support.
      - name: Test
        env:
          PRISM_REQUIRE_RAW: ${{ matrix.libraw == 'ON' && '1' || '0' }}
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --parallel 4

  # The desktop app (PRISM_BUILD_GUI=ON: SDL3 + Dear ImGui), build only: a runner has no display
  # to open the window on, and the GUI's logic is tested without one in every job above
  # (prism_gui_core_tests). Separate from the matrix above so those jobs don't download SDL.
  gui:
    name: GUI build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      # SDL finds the windowing systems it can talk to at configure time: X11 and Wayland, plus
      # D-Bus for the file dialogs (xdg-desktop-portal). Audio, joystick and the other
      # subsystems are turned off in cmake/GuiDependencies.cmake, so their packages aren't needed.
      - name: Install SDL's Linux dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
          libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev
          libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev
          libwayland-dev libdecor-0-dev wayland-protocols

      - name: Cache FetchContent downloads
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-gui-${{ matrix.os }}-${{ hashFiles('cmake/GuiDependencies.cmake') }}

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DPRISM_BUILD_GUI=ON
          -DPRISM_BUILD_TESTS=OFF
          -DPRISM_WITH_LIBRAW=OFF
          -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.deps

      - name: Build prism_gui
        run: cmake --build build --config Release --target prism_gui --parallel
